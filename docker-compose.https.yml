services:
  backend:
    ports: !reset []
    environment:
      FRONTEND_URL: https://localhost:8443
      PUBLIC_API_PATH: /api
      GOOGLE_REDIRECT_URI: https://localhost:8443/api/auth/google/callback
      # Only this isolated Docker network can supply the client address.
      TRUSTED_PROXY_CIDRS: 172.29.247.0/24
  frontend:
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_API_URL: /api
  https:
    image: nginx:1.28-alpine
    ports:
      - "8443:443"
      - "8088:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - social-network
networks:
  social-network:
    ipam:
      config:
        - subnet: 172.29.247.0/24
