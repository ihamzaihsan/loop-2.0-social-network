services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social-network-backend
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/uploads
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_PATH: /app/data/social-network.db
      PORT: 8080
    restart: unless-stopped
    networks:
      - social-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PORT: ${API_PORT:-8080}
    container_name: social-network-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - social-network

networks:
  social-network:
    driver: bridge
