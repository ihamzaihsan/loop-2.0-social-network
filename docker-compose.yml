version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social-network-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/uploads
    environment:
      - DB_PATH=/app/data/social-network.db
    restart: unless-stopped
    networks:
      - social-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-network-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    restart: unless-stopped
    networks:
      - social-network

networks:
  social-network:
    driver: bridge

volumes:
  social-data:
